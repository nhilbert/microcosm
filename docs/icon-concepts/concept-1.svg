<!-- A membrane reduced to a lens: one tilted ellipse crossed by a single off-centre division line. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="pool" cx="50%" cy="46%" r="62%">
      <stop offset="0%"   stop-color="#3F5D7B"/>
      <stop offset="42%"  stop-color="#24415C"/>
      <stop offset="74%"  stop-color="#16273A"/>
      <stop offset="100%" stop-color="#0B131E"/>
    </radialGradient>
  </defs>

  <g id="icon">
    <!-- 1: the water -->
    <rect x="0" y="0" width="512" height="512" fill="url(#pool)"/>

    <g transform="rotate(-28 256 256)">
      <!-- 2: the membrane -->
      <ellipse cx="256" cy="256" rx="140" ry="88"
               fill="none" stroke="#A8D6F4" stroke-width="14"/>

      <!-- 3: the division plane, held off the centre -->
      <line x1="304" y1="204" x2="304" y2="308"
            stroke="#46D68C" stroke-width="16" stroke-linecap="round"/>
    </g>
  </g>
</svg>
