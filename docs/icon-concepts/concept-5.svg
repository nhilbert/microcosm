<!-- Three glowing bodies — alga, grazer, decomposer — standing at three stations of one implied round, with a single pale mineral speck in transit between them. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Microcosm: three glowing bodies on one implied round">
  <defs>
    <!-- lit pool: the sun's reach into near-black water -->
    <radialGradient id="pool" cx="0.5" cy="0.46" r="0.62">
      <stop offset="0"    stop-color="#2E4A63" stop-opacity="0.55"/>
      <stop offset="0.42" stop-color="#1B3048" stop-opacity="0.42"/>
      <stop offset="0.78" stop-color="#0C1724" stop-opacity="0.22"/>
      <stop offset="1"    stop-color="#0C1724" stop-opacity="0"/>
    </radialGradient>

    <!-- bloom around each body -->
    <radialGradient id="glowSolara" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#46D68C" stop-opacity="0.55"/>
      <stop offset="0.34" stop-color="#46D68C" stop-opacity="0.26"/>
      <stop offset="0.68" stop-color="#46D68C" stop-opacity="0.08"/>
      <stop offset="1"    stop-color="#46D68C" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCilio" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#D7A6E8" stop-opacity="0.50"/>
      <stop offset="0.34" stop-color="#D7A6E8" stop-opacity="0.23"/>
      <stop offset="0.68" stop-color="#D7A6E8" stop-opacity="0.07"/>
      <stop offset="1"    stop-color="#D7A6E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBacillus" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#9EA868" stop-opacity="0.46"/>
      <stop offset="0.34" stop-color="#9EA868" stop-opacity="0.21"/>
      <stop offset="0.68" stop-color="#9EA868" stop-opacity="0.06"/>
      <stop offset="1"    stop-color="#9EA868" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowMineral" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0"    stop-color="#C9D7E3" stop-opacity="0.40"/>
      <stop offset="0.45" stop-color="#C9D7E3" stop-opacity="0.14"/>
      <stop offset="1"    stop-color="#C9D7E3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g id="icon">
    <!-- 1. full-bleed water -->
    <rect x="0" y="0" width="512" height="512" fill="#0B131E"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#pool)"/>

    <!-- the round: suggested only, a dotted trace under the bodies -->
    <circle cx="256" cy="256" r="86"
            fill="none" stroke="#C9D7E3" stroke-opacity="0.17"
            stroke-width="5" stroke-linecap="round" stroke-dasharray="3 29"/>

    <!-- alga — Solara green, the largest body, station left of centre -->
    <circle cx="166" cy="275" r="62" fill="url(#glowSolara)"/>
    <circle cx="166" cy="275" r="34" fill="#46D68C"/>

    <!-- grazer — Cilio purple, station upper right -->
    <circle cx="299" cy="182" r="58" fill="url(#glowCilio)"/>
    <circle cx="299" cy="182" r="27" fill="#D7A6E8"/>

    <!-- decomposer — Bacillus olive, station lower right -->
    <circle cx="316" cy="306" r="54" fill="url(#glowBacillus)"/>
    <circle cx="316" cy="306" r="24" fill="#9EA868"/>

    <!-- the mineral, in transit on the round -->
    <circle cx="235" cy="339" r="19" fill="url(#glowMineral)"/>
    <circle cx="235" cy="339" r="6"  fill="#C9D7E3"/>
  </g>
</svg>
