<!-- THE ROUND, TILTED: the same circle of matter - alga (green) to grazer (purple) to decomposer (olive) - lying at an angle in the water, one mineral speck crossing the hand-off. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="litPool" cx="50%" cy="46%" r="62%">
      <stop offset="0%" stop-color="#2E4A63"/><stop offset="42%" stop-color="#1B3048"/>
      <stop offset="78%" stop-color="#0C1724"/><stop offset="100%" stop-color="#0B131E"/>
    </radialGradient>
  </defs>
  <g id="icon">
    <rect x="0" y="0" width="512" height="512" fill="#0B131E"/>
    <rect x="0" y="0" width="512" height="512" fill="url(#litPool)"/>
    <!-- the ring lies in the plane of the water: tilted 20 deg, squashed to 0.66 -->
    <g transform="translate(256,256) rotate(-20) scale(1,0.66)" fill="none" stroke-linecap="round">
      <path d="M -11.853 -135.482 A 136 136 0 0 1 130.057 39.763" stroke="#46D68C" stroke-width="36"/>
      <path d="M 123.258 57.476 A 136 136 0 0 1 -99.464 92.752" stroke="#D7A6E8" stroke-width="34"/>
      <path d="M -111.405 78.006 A 136 136 0 0 1 -30.593 -132.514" stroke="#9EA868" stroke-width="32"/>
      <circle cx="-21.271" cy="-134.324" r="15" fill="#C9D7E3" stroke="none"/>
    </g>
  </g>
</svg>
