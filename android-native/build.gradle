// The native app: the Rust core (rust/microcosm-core) on the phone through JNI.
//
// Separate from android/, which is the WebView wrapper around the JS artifact. They install side
// by side under different applicationIds, so working on this one cannot break the app that ships.
//
// M5.0 (docs/android-port-plan.md) is a diagnostics screen, not the game: it exists to measure the
// two things a container could not — ARM64 bit-exactness and the tick rate on real hardware.
plugins {
    id "com.android.application" version "8.7.3" apply false
    id "org.jetbrains.kotlin.android" version "2.0.21" apply false
}
