plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

def vCode = (findProperty("versionCode") ?: "1").toInteger()

android {
    namespace "org.microcosm.probe"
    compileSdk 35

    defaultConfig {
        applicationId "org.microcosm.probe"
        // Same floor as the wrapper. arm64 only: every phone this is aimed at is 64-bit, and a
        // second ABI would double the Rust build time in CI for nothing.
        minSdk 26
        targetSdk 35
        versionCode vCode
        versionName "0.1.0"
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    // The same identity-only keystore as the wrapper, for the same reason: consecutive sideloaded
    // builds must share a signature so the phone treats them as updates. It guards nothing.
    signingConfigs {
        release {
            storeFile file("../../android/keystore/microcosm.keystore")
            storePassword "microcosm"
            keyAlias "microcosm"
            keyPassword "microcosm"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // cargo-ndk writes libmicrocosm.so here; tools/build-native.sh does that step.
    sourceSets {
        main {
            jniLibs.srcDirs = ["src/main/jniLibs"]
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

// Dependency-free, like the wrapper: a plain Activity and a TextView. The Compose UI arrives with
// M5.1; adding it now would only slow the build that answers the measurement questions.
