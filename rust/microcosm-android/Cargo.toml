[package]
name = "microcosm-android"
version = "0.1.0"
edition = "2021"
description = "JNI glue for the Microcosm core on Android"
license = "GPL-3.0-or-later"

[lib]
# libmicrocosm.so — what System.loadLibrary("microcosm") picks up.
name = "microcosm"
crate-type = ["cdylib"]

[dependencies]
# The core stays dependency-free; the JNI binding lives out here so `jni` never enters the
# crate whose arithmetic has to be auditable.
microcosm-core = { path = "../microcosm-core" }
jni = "0.21"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
