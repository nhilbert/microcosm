[package]
name = "microcosm-core"
version = "0.1.0"
edition = "2021"
description = "Microcosm simulation core — a bit-exact translation of src/sim (see docs/porting.md)"
license = "GPL-3.0-or-later"

[features]
# Compile-check scaffolding only: routes `math` to platform libm so the crate can be built while
# the verified math module is being written. NEVER enable this for a real run — platform libm
# differs per OS and architecture, which is exactly what the port exists to escape.
stub-math = []

[lib]
crate-type = ["lib"]

[profile.release]
# Determinism first: no fast-math exists in stable Rust, and FMA contraction is not a legal
# optimization (RFC 3514), so release builds are safe — but keep overflow checks off the hot path
# only, never the wrapping semantics the PRNG depends on (those are explicit `wrapping_*` calls).
opt-level = 3
