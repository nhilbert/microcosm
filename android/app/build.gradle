plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
}

// CI passes -PversionCode=<run number> so each downloaded APK installs over
// the previous one; locally it defaults to 1.
def vCode = (findProperty("versionCode") ?: "1").toInteger()

android {
    namespace "org.microcosm.sandbox"
    compileSdk 35

    defaultConfig {
        applicationId "org.microcosm.sandbox"
        minSdk 26
        targetSdk 35
        versionCode vCode
        versionName "0.4.0"
    }

    // Identity-only keystore, committed on purpose: it exists so every CI
    // build carries the same signature and the phone accepts each new APK as
    // an update instead of demanding an uninstall. It protects nothing and
    // is not a secret (sideload distribution only, never a store).
    signingConfigs {
        release {
            storeFile file("../keystore/microcosm.keystore")
            storePassword "microcosm"
            keyAlias "microcosm"
            keyPassword "microcosm"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = "17"
    }
}

// No dependencies: the activity extends android.app.Activity and the world
// lives in the WebView. Keeping the wrapper dependency-free keeps the APK
// small and the CI build fast.
