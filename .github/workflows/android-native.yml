name: Android native probe

# Builds the Rust core for ARM64 and wraps it in a diagnostics APK (android-native/).
#
# This is the build that answers the two questions a container could not: is the arithmetic
# bit-exact on ARM64, and how fast does the core tick on real hardware. Everything else about the
# port was proved against the JavaScript core on x86-64 (docs/android-port-plan.md M5.0).
#
# Separate from android-apk.yml, which builds the shipping WebView wrapper. Different
# applicationId, so both install side by side and work here cannot break the app that ships.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "rust/**"
      - "android-native/**"
      - "dev/xcheck/gen-bin.js"
      - "tools/build-native.sh"
      - ".github/workflows/android-native.yml"

permissions:
  contents: write

jobs:
  probe:
    name: Build the native probe APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      # The host self-check runs the same code the phone will. If the embedded fingerprints have
      # gone stale it fails HERE, where the cause is unambiguous, rather than on a device where
      # nobody could tell a stale constant from a hardware difference.
      - name: Host self-check (keeps the embedded constants honest)
        run: |
          node dev/xcheck/gen-bin.js "$RUNNER_TEMP/trace.bin" 10000
          cd rust/microcosm-core
          cargo run --release --quiet --bin selfcheck -- "$RUNNER_TEMP/trace.bin"

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the core for arm64-v8a, and the trace asset
        run: tools/build-native.sh arm64-v8a

      - name: Build signed APK
        run: gradle -p android-native assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Collect APK
        run: cp android-native/app/build/outputs/apk/release/app-release.apk microcosm-probe.apk

      - uses: actions/upload-artifact@v4
        with:
          name: microcosm-probe-apk
          path: microcosm-probe.apk

      - name: Update the rolling probe-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: probe-latest
          name: Microcosm native probe (latest)
          prerelease: true
          files: microcosm-probe.apk
          body: |
            Diagnostics build of the **Rust core running natively on the phone**.
            Not the game — it prints numbers and stops.

            Open this page on the phone, download `microcosm-probe.apk` and install it.
            It installs alongside the sandbox app (different applicationId), so it cannot
            disturb it. On launch it:

            - reproduces the four certified 3,000-tick world fingerprints (if these match,
              the whole simulation is bit-exact on ARM64);
            - replays V8 12.4's own results for sin/cos/exp/pow/atan2/hypot/sqrt;
            - saves a world, loads it back and checks the resumed run matches;
            - measures the tick rate on this device.

            Please copy the output back — those numbers close the last two open claims in
            docs/android-port-plan.md.
