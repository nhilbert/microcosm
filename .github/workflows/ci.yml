name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Build & conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # pinned: the fingerprints were captured on V8 12.4 (see package.json)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm install --no-audit --no-fund

      - name: Build the artifact
        run: npm run build

      - name: dist/ must match src/
        run: |
          if ! git diff --exit-code -- dist/; then
            echo "::error::dist/microcosm.jsx is out of date. Run 'npm run build' and commit the result."
            exit 1
          fi

      - name: Syntax check
        run: npm run syntax

      - name: Harness self-test (estimators on synthetic series)
        run: npm run selftest

      - name: Conformance (must be bit-identical)
        run: |
          out=$(npm run --silent conform)
          echo "$out"
          if echo "$out" | grep -q "NOTE:"; then
            echo "::error::conform.js printed a NOTE — the baseline no longer certifies core.js. Rebind it deliberately; see CONTRIBUTING.md."
            exit 1
          fi

      # Both are in `npm test`; CI runs the steps individually, so they need naming here too.
      - name: Player-language gate
        run: node harness/prose.js

      - name: Render smoke (the painting path runs)
        run: node harness/render-smoke.js

  acceptance:
    name: Ecology acceptance (manual, ~40 min)
    runs-on: ubuntu-latest
    # Long-horizon runs; every one passes on the shipped tree (see README "Status" for the numbers).
    # Manual because of the wall time, not because of doubt.
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'   # pinned: the fingerprints were captured on V8 12.4 (see package.json)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: npm install --no-audit --no-fund
      - name: 8-seed ecology harness
        run: npm run tune
      - name: K6 observatory gate (reference world)
        run: npm run gate
      - name: Phase 5 gate (the Observatory narrates the evolution)
        run: npm run gate5
      - name: Corridor certification (rails + evolution as the fuzzer)
        run: npm run build && node harness/corridor.js --rails --fuzz

  port:
    name: Rust core — bit-exactness against the JavaScript core
    runs-on: ubuntu-latest
    # The port's standing proof (docs/android-port-plan.md). Cheap enough to run on every push:
    # the WASM build is seconds, and 3,000 ticks x 4 fingerprints is under a minute.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: npm install --no-audit --no-fund

      - name: Build the artifact (the port is compared against it)
        run: npm run build

      - name: The generated species table must match src/sim/species.json
        run: |
          node tools/gen-species-rs.js
          if ! git diff --exit-code -- rust/microcosm-core/src/species_gen.rs rust/wasm/species-normalized.json; then
            echo "::error::species_gen.rs is out of date. Run 'node tools/gen-species-rs.js' and commit the result."
            exit 1
          fi

      - name: The generated level table must match src/observatory/levels.json
        run: |
          node tools/gen-levels-rs.js
          if ! git diff --exit-code -- rust/microcosm-core/src/levels_gen.rs; then
            echo "::error::levels_gen.rs is out of date. Run 'node tools/gen-levels-rs.js' and commit the result."
            exit 1
          fi

      - name: Build the core for WASM
        run: npm run wasm

      - name: Math must be bit-identical to V8
        run: |
          node dev/xcheck/gen.js "$RUNNER_TEMP/trace.txt"
          npm run --silent port:math -- "$RUNNER_TEMP/trace.txt"

      # Inherited from the retired android-native workflow. The probe APK is gone; the check it
      # carried is not. It keeps the fingerprints embedded in microcosm_core::probe honest, so a
      # future device build can be wired to these constants instead of new ones.
      - name: Host self-check (keeps the embedded constants honest)
        run: |
          node dev/xcheck/gen-bin.js "$RUNNER_TEMP/trace.bin" 10000
          cd rust/microcosm-core
          cargo run --release --quiet --bin selfcheck -- "$RUNNER_TEMP/trace.bin"

      # The certifying harness for the core after the M4 handover: the fingerprint, the hash of
      # the Rust sources that binds it, and native-vs-WASM identity (two targets disagreeing means
      # the core stopped being deterministic across platforms).
      - name: Core conformance (and native == wasm)
        run: |
          out=$(npm run --silent conform:core)
          echo "$out"
          if echo "$out" | grep -q "NOTE:"; then
            echo "::error::conform-core.js printed a NOTE — the core baseline no longer certifies the sources that produce it. Rebind it deliberately; see docs/porting.md."
            exit 1
          fi

      # Still the strongest check here, and expected to fail at the first declared ecology change
      # in Rust — at which point it retires into the record (docs/porting.md §7).
      - name: The Rust core must still reproduce the frozen JavaScript oracle
        run: npm run --silent port:check

      - name: Save/load must resume a world exactly
        run: npm run --silent port:snapshot

      - name: The Observatory must narrate identically (K6 gate on the ported core)
        run: MC_CORE=$PWD/rust/wasm/core.js node harness/k6gate.js

      # The level runtime is the ported core's, so the honesty gate has to hold there too: every
      # level still fails untouched, passes on its lesson, and fails on the wrong lever.
      - name: The levels gate must pass on the ported core
        run: MC_CORE=$PWD/rust/wasm/core.js node harness/levels.js
