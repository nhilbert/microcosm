name: Android app

# Builds the native app (android-app/): the Rust core on the phone, painting the frame builder's
# display list on a SurfaceView. M5.1 of docs/android-port-plan.md, planned in
# docs/android-app-plan.md.
#
# The only Android workflow since the diagnostics probe and the WebView wrapper retired.
#
# This workflow is the Kotlin's compiler of record: not every development container carries an
# Android SDK, so a red build here is the signal that something does not compile.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "rust/**"
      - "android-app/**"
      # build.gradle mounts the repo-root assets into the APK, and the tests assert on them
      # (StartsTest, HelpPageTest, BootTest); the keystore signs the release.
      - "assets/**"
      - "keystore/**"
      - "tools/build-app.sh"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

jobs:
  app:
    name: Build the app APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the core + JNI adapter for arm64-v8a
        run: tools/build-app.sh arm64-v8a

      # The boot gate (BootTest) launches the real MainActivity with the real core on the JVM,
      # so it needs a host build of the JNI crate. It exists because a startup crash — a child
      # moved between parents in onCreate — shipped through green CI to the owner's phone: the
      # layout gate measures the rows Chrome builds, and nothing here executed MainActivity.
      - name: Build the core for the host (the boot gate loads it)
        run: cargo build --release --manifest-path rust/microcosm-android/Cargo.toml

      # The layout gate: docs/app-ux-review.md §6. Every other gate in this repository is about
      # the world; this one is about the screen, and it exists because a nine-button bar that
      # overflowed a 408 dp phone shipped through nine green runs of this very workflow.
      - name: Layout and boot gates
        run: gradle -p android-app testReleaseUnitTest --no-daemon

      - name: Build signed APK
        run: gradle -p android-app assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Collect APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk microcosm-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: microcosm-app-apk
          path: microcosm-app.apk

      # The body below is meant to stay true across builds: it says what the app is and how the
      # release works, never which increment it is on. What the app can and cannot do today is
      # in docs/status-log.md, and the body points there instead of repeating it.
      - name: Update the rolling app-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Microcosm app (latest build)
          prerelease: true
          files: microcosm-app.apk
          body: |
            **Microcosm** is a pond you can hold in your hand: artificial organisms photosynthesise,
            graze, hunt, starve, reproduce and rot inside a world where matter is strictly
            conserved, and the app can tell you where every unit of it went. It is a toy, not a
            model of anything real. The point is to poke a complicated living system and find out
            what happens.

            This is the native app: the Rust core (`rust/microcosm-core`) running on the phone,
            painting the shared frame builder's display list on a SurfaceView. The browser build in
            the repository is the reference the renderer is proved against, not the product.
            Background: `docs/android-app-plan.md`.

            **Install.** Open this page on the phone, download `microcosm-app.apk` and open it.
            Android will ask you to allow installs from your browser, since the app is not on any
            store. Every build carries the same signing identity, so a new one installs over the old
            one and keeps your saved worlds. It needs Android 8.0 or newer on a 64-bit ARM phone,
            which is nearly every phone sold since 2017.

            **What is in it.**
            - The sandbox, with five openings: the pond, still water, two suns, the pen, lean water.
            - Levers: drag or dim the sun, pour minerals, feed or kill an individual, seed a species,
              draw walls, set the Evolution dials. Every intervention is an event: logged, undoable,
              and reported on by an impact card that says *since*, never *because*.
            - Experiments: a ladder of levels, each a prediction to make and a lever to find.
            - Data: six pages of instruments, from populations and chemistry to traits and an
              event feed of what you did and what the world did.
            - Help: how the mineral goes round, and one card per creature beside its real model.
            - Save and load. English and German.

            **What this release is.** A rolling build, marked pre-release because that is what it
            is. CI rebuilds it and replaces the file on every push that touches the app or the
            core, on main and on working branches alike, so this file can be ahead of main. The
            build number inside the app is the CI run number. What the app can and cannot do at
            any given moment is written down in `docs/status-log.md`, not here; this text is meant
            to stay true.

            The signing key is committed on purpose and guards nothing (`keystore/README.md`).
            It exists so that updates install in place. It proves nothing about who built the file,
            so download from this page and nowhere else.
