name: Android app

# Builds the native app (android-app/): the Rust core on the phone, painting the frame builder's
# display list on a SurfaceView. M5.1 of docs/android-port-plan.md, planned in
# docs/android-app-plan.md.
#
# Separate from android-native.yml (the diagnostics probe) and android-apk.yml (the WebView
# wrapper). Three applicationIds, so all three install side by side and none can break the others.
#
# This workflow is also the only compiler the Kotlin ever sees: the development container has no
# Android SDK, so a red build here is the first signal that something does not compile.

on:
  workflow_dispatch:
  push:
    branches: [main, "claude/**"]
    paths:
      - "rust/**"
      - "android-app/**"
      - "tools/build-app.sh"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

jobs:
  app:
    name: Build the app APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Build the core + JNI adapter for arm64-v8a
        run: tools/build-app.sh arm64-v8a

      # The boot gate (BootTest) launches the real MainActivity with the real core on the JVM,
      # so it needs a host build of the JNI crate. It exists because a startup crash — a child
      # moved between parents in onCreate — shipped through green CI to the owner's phone: the
      # layout gate measures the rows Chrome builds, and nothing here executed MainActivity.
      - name: Build the core for the host (the boot gate loads it)
        run: cargo build --release --manifest-path rust/microcosm-android/Cargo.toml

      # The layout gate: docs/app-ux-review.md §6. Every other gate in this repository is about
      # the world; this one is about the screen, and it exists because a nine-button bar that
      # overflowed a 408 dp phone shipped through nine green runs of this very workflow.
      - name: Layout and boot gates
        run: gradle -p android-app testReleaseUnitTest --no-daemon

      - name: Build signed APK
        run: gradle -p android-app assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Collect APK
        run: cp android-app/app/build/outputs/apk/release/app-release.apk microcosm-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: microcosm-app-apk
          path: microcosm-app.apk

      - name: Update the rolling app-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-latest
          name: Microcosm native app (latest)
          prerelease: true
          files: microcosm-app.apk
          body: |
            The **native app**: the Rust core running on the phone, painting the shared frame
            builder's display list on a SurfaceView.

            Open this page on the phone, download `microcosm-app.apk` and install it. It installs
            alongside the sandbox app and the probe (three different applicationIds), so it cannot
            disturb either.

            This is increment **A.1** of docs/android-app-plan.md — the world renders and the
            clock runs, and that is all. There are no gestures, no levers, no panels yet.

            - **pause / 1x / 4x / 16x** set the speed.
            - **benchmark** pauses, runs the world to t=3,000, then paints 60 frames at each of
              five zoom levels and reports milliseconds per frame, split into the core's frame
              builder and the Canvas paint. Tap the report to dismiss it.

            The number to look for: M5.0 measured the core at 0.400 ms/tick (250x real time)
            against a UI that used to cap at 16x. This says what the renderer's real budget is.
